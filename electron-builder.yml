appId: com.aikanpan.desktop
productName: AIkanpan
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - out/**/*
  - package.json
  - build/icon.ico
  - "!**/*.map"
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AIkanpan
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
compression: normal
